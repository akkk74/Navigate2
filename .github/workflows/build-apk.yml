name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS (вместо CDN-компилятора)
        run: |
          npx --yes tailwindcss@3.4.17 -i tools/tw.css -o app/src/main/assets/tailwind.css \
            --content "app/src/main/assets/engine.js" --minify || echo "Tailwind build failed, fallback to CDN"
          ls -l app/src/main/assets/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          ls -l app/build/outputs/apk/debug/
          $BT/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $BT/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: Sputnik-APK
          path: app/build/outputs/apk/debug/app-debug.apk
